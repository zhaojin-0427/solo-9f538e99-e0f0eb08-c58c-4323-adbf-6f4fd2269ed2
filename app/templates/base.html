<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}病理图像清单划分{% endblock %}</title>
  <style>
    :root { --blue:#2563eb; --red:#dc2626; --green:#16a34a; --gray:#64748b; --line:#e2e8f0; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: "PingFang SC","Microsoft YaHei",system-ui,sans-serif; color:#0f172a; background:#f8fafc; }
    header { background:#0f172a; color:#fff; padding:14px 28px; display:flex; align-items:center; gap:24px; }
    header h1 { font-size:18px; margin:0; }
    header nav a { color:#cbd5e1; text-decoration:none; margin-right:18px; font-size:14px; }
    header nav a:hover { color:#fff; }
    main { max-width:1180px; margin:24px auto; padding:0 20px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:20px 22px; margin-bottom:20px; }
    .card h2 { margin:0 0 14px; font-size:16px; }
    table { border-collapse:collapse; width:100%; font-size:13px; }
    th,td { border:1px solid var(--line); padding:7px 10px; text-align:left; }
    th { background:#f1f5f9; }
    .flash { padding:11px 16px; border-radius:8px; margin-bottom:16px; font-size:14px; }
    .flash.error { background:#fef2f2; color:var(--red); border:1px solid #fecaca; }
    .flash.success { background:#f0fdf4; color:var(--green); border:1px solid #bbf7d0; }
    .btn { display:inline-block; background:var(--blue); color:#fff; border:0; border-radius:7px; padding:9px 18px; font-size:14px; cursor:pointer; text-decoration:none; }
    .btn.secondary { background:#475569; }
    .btn.small { padding:5px 11px; font-size:12px; }
    .btn:disabled { background:#94a3b8; cursor:not-allowed; }
    .muted { color:var(--gray); font-size:13px; }
    .tag { display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; }
    .tag.val { background:#dbeafe; color:#1d4ed8; }
    .tag.train { background:#f1f5f9; color:#334155; }
    .tag.ok { background:#dcfce7; color:#15803d; }
    .tag.fail { background:#fee2e2; color:#b91c1c; }
    .tag.run { background:#fef9c3; color:#a16207; }
    .tag.hist { background:#ede9fe; color:#6d28d9; }
    input[type=number] { width:90px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; }
    input[type=file] { font-size:13px; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    code { background:#f1f5f9; padding:1px 5px; border-radius:4px; }
    pre { background:#0f172a; color:#e2e8f0; padding:14px; border-radius:8px; overflow:auto; font-size:12px; max-height:340px; }
    .reason { white-space:pre-wrap; background:#fef2f2; border:1px solid #fecaca; color:#991b1b; padding:12px 14px; border-radius:8px; font-size:13px; }
  </style>
</head>
<body>
<header>
  <h1>病理图像训练/验证清单划分系统</h1>
  <nav>
    <a href="{{ url_for('index') }}">当前版本</a>
    <a href="{{ url_for('history') }}">历史与原因</a>
    <a href="{{ url_for('registry') }}">永久侧别登记</a>
  </nav>
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
      <div class="flash {{ category }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  {% block body %}{% endblock %}
</main>
</body>
</html>
